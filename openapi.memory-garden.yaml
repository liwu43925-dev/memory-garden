openapi: 3.1.0
info: {title: Memory Garden API, version: '2026-11-06', description: 'Demo-to-production contract. Page A responses are safe projections only.'}
servers: [{url: https://api.example.invalid/v1, description: Contract placeholder}]
security: [{bearerAuth: []}]
paths:
  /relations:
    get: {operationId: listRelations, responses: {'200': {$ref: '#/components/responses/RelationPage'}, '401': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/members:
    get: {operationId: listMembers, parameters: [{$ref: '#/components/parameters/RelationId'}], responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Member'}}}}}, '403': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/territory:
    get: {operationId: getTerritory, parameters: [{$ref: '#/components/parameters/RelationId'}], responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Territory'}}}}}}
    patch: {operationId: updateTerritory, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/IfMatch'}], requestBody: {$ref: '#/components/requestBodies/TerritoryPatch'}, responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Territory'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/records:
    get: {operationId: listRecords, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {name: kind, in: query, schema: {$ref: '#/components/schemas/RecordKind'}}, {name: visibility, in: query, schema: {$ref: '#/components/schemas/Visibility'}}, {name: mapped, in: query, schema: {type: boolean}}], responses: {'200': {$ref: '#/components/responses/RecordPage'}, '403': {$ref: '#/components/responses/Problem'}}}
    post: {operationId: createRecord, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordCreate'}}}}, responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Record'}}}}, '422': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/records/{recordId}:
    get: {operationId: getRecord, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/RecordId'}], responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Record'}}}}, '404': {$ref: '#/components/responses/Problem'}}}
    delete: {operationId: deleteRecord, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/RecordId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'204': {description: Deleted}, '409': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/records/{recordId}/preprocess:
    post: {operationId: preprocessRecord, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/RecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {description: User-confirmable candidates or safety pause, content: {application/json: {schema: {$ref: '#/components/schemas/PreprocessResult'}}}}, '422': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/records/{recordId}/confirm:
    post: {operationId: confirmRecord, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/RecordId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecordConfirmation'}}}}, responses: {'200': {description: Confirmed; cooling response carries absolute server time, content: {application/json: {schema: {$ref: '#/components/schemas/Record'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/records/{recordId}/transition:
    post: {operationId: transitionRecord, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/RecordId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [to], properties: {to: {$ref: '#/components/schemas/RecordStatus'}}}}}}, responses: {'200': {description: Transitioned, content: {application/json: {schema: {$ref: '#/components/schemas/Record'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/uploads:
    post: {operationId: createUploadSession, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadRequest'}}}}, responses: {'201': {description: Upload session, content: {application/json: {schema: {$ref: '#/components/schemas/UploadSession'}}}}}}
  /relations/{relationId}/uploads/{uploadId}/complete:
    post: {operationId: completeUpload, parameters: [{$ref: '#/components/parameters/RelationId'}, {name: uploadId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {description: Media accepted after server validation, content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}, '422': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/scene-snapshots/{scene}:
    get: {operationId: getSceneSnapshot, parameters: [{$ref: '#/components/parameters/RelationId'}, {name: scene, in: path, required: true, schema: {type: string, enum: [garden, home]}}], responses: {'200': {description: Safe Page A projection only, content: {application/json: {schema: {$ref: '#/components/schemas/SceneSnapshot'}}}}, '403': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/audio/{recordId}/playback-token:
    post: {operationId: issueAudioPlaybackToken, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/RecordId'}], responses: {'200': {description: Short-lived authorized media URL, content: {application/json: {schema: {$ref: '#/components/schemas/PlaybackToken'}}}}, '403': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/alignments:
    post: {operationId: createAlignment, parameters: [{$ref: '#/components/parameters/RelationId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [participantIds], properties: {participantIds: {type: array, minItems: 2, maxItems: 2, items: {type: string}}, relatedRecordId: {type: string}}}}}}, responses: {'201': {description: Started by user, content: {application/json: {schema: {$ref: '#/components/schemas/Alignment'}}}}}
  /relations/{relationId}/alignments/{alignmentId}/inputs:
    post: {operationId: submitAlignmentInput, parameters: [{$ref: '#/components/parameters/RelationId'}, {name: alignmentId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AlignmentInput'}}}}, responses: {'200': {description: Private self-review view, content: {application/json: {schema: {$ref: '#/components/schemas/SelfReview'}}}}}
  /relations/{relationId}/alignments/{alignmentId}/self-review:
    patch: {operationId: reviewAlignmentSelf, parameters: [{$ref: '#/components/parameters/RelationId'}, {name: alignmentId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SelfReviewPatch'}}}}, responses: {'200': {description: Updated self-review, content: {application/json: {schema: {$ref: '#/components/schemas/SelfReview'}}}}}
  /relations/{relationId}/alignments/{alignmentId}/summary:
    get: {operationId: getAlignmentSummary, parameters: [{$ref: '#/components/parameters/RelationId'}, {name: alignmentId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Only after both self reviews; otherwise progress-only object, content: {application/json: {schema: {$ref: '#/components/schemas/AlignmentSummary'}}}}, '404': {$ref: '#/components/responses/Problem'}}}
  /relations/{relationId}/alignments/{alignmentId}/save:
    post: {operationId: saveAlignment, parameters: [{$ref: '#/components/parameters/RelationId'}, {name: alignmentId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {description: Saved only after both confirmations, content: {application/json: {schema: {$ref: '#/components/schemas/Alignment'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/agent/preprocess:
    post: {operationId: agentPreprocess, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentContentRequest'}}}}, responses: {'200': {description: User-confirmable preprocessing or deterministic safety pause, content: {application/json: {schema: {$ref: '#/components/schemas/PreprocessResult'}}}}, '403': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '502': {$ref: '#/components/responses/Problem'}}}
  /api/agent/translate-memory:
    post: {operationId: translateMemory, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRecordRequest'}}}}, responses: {'200': {description: Private, user-confirmable neutral translation, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProposal'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/agent/map-imagery:
    post: {operationId: proposeImageryMapping, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRecordRequest'}}}}, responses: {'200': {description: Proposal only after deterministic state checks, content: {application/json: {schema: {$ref: '#/components/schemas/ImageryProposal'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/agent/record-narration:
    post: {operationId: narrateAudioMemory, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentRecordRequest'}}}}, responses: {'200': {description: User-confirmable narrative; no audio auto-play, content: {application/json: {schema: {$ref: '#/components/schemas/AgentProposal'}}}}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/agent/alignment-summary:
    post: {operationId: summarizeAlignment, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentAlignmentRequest'}}}}, responses: {'200': {description: Returned only after both self reviews and confirmation, content: {application/json: {schema: {$ref: '#/components/schemas/AlignmentSummary'}}}}, '409': {$ref: '#/components/responses/Problem'}}}
  /api/agent/safety-check:
    post: {operationId: agentSafetyCheck, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentContentRequest'}}}}, responses: {'200': {description: Deterministic safety result; resources are configuration-driven, content: {application/json: {schema: {$ref: '#/components/schemas/SafetyResult'}}}}, '403': {$ref: '#/components/responses/Problem'}}}
  /safety/evaluate:
    post: {operationId: evaluateSafety, requestBody: {required: true, content: {application/json: {schema: {type: object, required: [relationId, content], properties: {relationId: {type: string}, content: {type: string}, purpose: {$ref: '#/components/schemas/Purpose'}}}}}}, responses: {'200': {description: Clear or paused; no unverified hotline payload, content: {application/json: {schema: {$ref: '#/components/schemas/SafetyResult'}}}}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    RelationId: {name: relationId, in: path, required: true, schema: {type: string}}
    RecordId: {name: recordId, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  responses:
    Problem: {description: Problem response, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
    RelationPage: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RelationPage'}}}}
    RecordPage: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RecordPage'}}}}
  requestBodies:
    TerritoryPatch: {required: true, content: {application/json: {schema: {type: object, properties: {state: {$ref: '#/components/schemas/TerritoryState'}, veilEnabled: {type: boolean}}}}}}
  schemas:
    RecordStatus: {type: string, enum: [draft, pending-ai, pending-user, cooling, archived, mapped, abandoned, private, deleted]}
    Visibility: {type: string, enum: [self, group]}
    RecordKind: {type: string, enum: [text, voice, image, audio]}
    Purpose: {type: string, enum: [memory, emotion, plan, alignment]}
    TerritoryState: {type: string, enum: [active, archived, destroy-cooling, deleted]}
    Member: {type: object, required: [memberId, displayName], properties: {memberId: {type: string}, displayName: {type: string}, role: {type: string}}}
    Territory: {type: object, required: [relationId, state], properties: {relationId: {type: string}, state: {$ref: '#/components/schemas/TerritoryState'}, veilEnabled: {type: boolean}, version: {type: string}}}
    RelationPage: {type: object, required: [items], properties: {items: {type: array, items: {type: object, required: [relationId, label], properties: {relationId: {type: string}, label: {type: string}, territoryState: {$ref: '#/components/schemas/TerritoryState'}}}}, nextCursor: {type: [string, 'null']}}}
    RecordCreate: {type: object, required: [kind, purpose, visibility], properties: {kind: {$ref: '#/components/schemas/RecordKind'}, purpose: {$ref: '#/components/schemas/Purpose'}, visibility: {$ref: '#/components/schemas/Visibility'}, rawText: {type: string, writeOnly: true}, mediaId: {type: string}, title: {type: string}, plan: {$ref: '#/components/schemas/Plan'}}}
    RecordConfirmation: {type: object, required: [choice], properties: {choice: {type: string, enum: [original, candidate, confirm, abandon]}, imageryType: {type: string, enum: [flower, petal, leaf]}, visibility: {$ref: '#/components/schemas/Visibility'}}}
    Record: {type: object, required: [recordId, relationId, kind, purpose, status, visibility, version], properties: {recordId: {type: string}, relationId: {type: string}, kind: {$ref: '#/components/schemas/RecordKind'}, purpose: {$ref: '#/components/schemas/Purpose'}, status: {$ref: '#/components/schemas/RecordStatus'}, visibility: {$ref: '#/components/schemas/Visibility'}, title: {type: string}, summary: {type: string}, rawText: {type: string, writeOnly: true}, transcript: {type: string, writeOnly: true}, rewriteCandidate: {type: string, writeOnly: true}, finalChoice: {type: string}, plan: {$ref: '#/components/schemas/Plan'}, coolingEndsAt: {type: string, format: date-time}, serverNow: {type: string, format: date-time}, version: {type: string}}}
    RecordPage: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Record'}}, nextCursor: {type: [string, 'null']}}}
    Plan: {type: object, properties: {originalText: {type: string}, date: {type: string}, time: {type: string}, timezone: {type: string}, location: {type: string}, participants: {type: array, items: {type: string}}, action: {type: string}, timeMeaning: {type: string, enum: [departure, arrival]}, reminder: {type: string}, complete: {type: boolean}}}
    UploadRequest: {type: object, required: [mediaKind, fileName, contentType], properties: {mediaKind: {type: string, enum: [image, audio]}, fileName: {type: string}, contentType: {type: string}, byteSize: {type: integer, minimum: 1}}}
    UploadSession: {type: object, required: [uploadId, uploadUrl, expiresAt], properties: {uploadId: {type: string}, uploadUrl: {type: string, format: uri}, expiresAt: {type: string, format: date-time}}}
    Media: {type: object, required: [mediaId, mediaKind], properties: {mediaId: {type: string}, mediaKind: {type: string, enum: [image, audio]}, status: {type: string, enum: [ready, rejected]}}}
    SceneImagery: {type: object, required: [imageryId, sourceRecordId, relationId, imageryType, scene], properties: {imageryId: {type: string}, sourceRecordId: {type: string}, relationId: {type: string}, imageryType: {type: string, enum: [flower, petal, leaf, branch, record, plant]}, scene: {type: string, enum: [garden, home]}, position: {type: object, properties: {x: {type: number}, y: {type: number}}}, title: {type: string}, occurredAt: {type: string, format: date-time}, location: {type: string}, note: {type: string}, confirmedEmotionTag: {type: string}, explanation: {type: string}}}
    SceneSnapshot: {type: object, required: [relationId, scene, imagery], properties: {relationId: {type: string}, scene: {type: string}, imagery: {type: array, items: {$ref: '#/components/schemas/SceneImagery'}}, monument: {type: [object, 'null']}, generatedAt: {type: string, format: date-time}}}
    PlaybackToken: {type: object, required: [url, expiresAt], properties: {url: {type: string, format: uri}, expiresAt: {type: string, format: date-time}}}
    AlignmentInput: {type: object, required: [rawText], properties: {rawText: {type: string, writeOnly: true}}}
    SelfReviewPatch: {type: object, required: [decision], properties: {decision: {type: string, enum: [confirm, edit, not-mine]}, fields: {type: object}}}
    SelfReview: {type: object, properties: {alignmentId: {type: string}, participantId: {type: string}, submitted: {type: boolean}, reviewed: {type: boolean}, fields: {type: object}}}
    Alignment: {type: object, properties: {alignmentId: {type: string}, relationId: {type: string}, state: {type: string, enum: [draft, collecting, reviewing, saved, paused, ended, deleted]}, participants: {type: array, items: {type: object, properties: {participantId: {type: string}, submitted: {type: boolean}, reviewed: {type: boolean}}}}}}
    AlignmentSummary: {type: object, properties: {alignmentId: {type: string}, ready: {type: boolean}, mismatches: {type: array, items: {type: string, enum: [intent, emotion-perception, fact-perception, unspoken-expectation, semantic-ambiguity]}}, neutralSummary: {type: string}}}
    PreprocessResult: {type: object, required: [safetyStatus], properties: {safetyStatus: {type: string, enum: [clear, paused]}, safe: {type: boolean}, suggestedPurpose: {$ref: '#/components/schemas/Purpose'}, requiresUserConfirmation: {type: boolean}, candidates: {type: object}}}
    AgentContentRequest: {type: object, required: [relationId, content], properties: {relationId: {type: string}, content: {type: string, maxLength: 4000}, purpose: {$ref: '#/components/schemas/Purpose'}}}
    AgentRecordRequest: {type: object, required: [relationId, recordId], properties: {relationId: {type: string}, recordId: {type: string}, locale: {type: string, default: zh-CN}}}
    AgentAlignmentRequest: {type: object, required: [relationId, alignmentId], properties: {relationId: {type: string}, alignmentId: {type: string}, locale: {type: string, default: zh-CN}}}
    AgentProposal: {type: object, required: [proposalId, requiresUserConfirmation, safetyStatus], properties: {proposalId: {type: string}, safetyStatus: {type: string, enum: [clear, paused]}, requiresUserConfirmation: {type: boolean, const: true}, neutralSummary: {type: string}, candidateText: {type: string}, changes: {type: array, items: {type: string}}}}
    ImageryProposal: {type: object, required: [proposalId, requiresUserConfirmation, imageryType], properties: {proposalId: {type: string}, requiresUserConfirmation: {type: boolean, const: true}, imageryType: {type: string, enum: [flower, petal, leaf, branch, record, plant]}, explanation: {type: string}}}
    SafetyResult: {type: object, required: [safetyStatus], properties: {safetyStatus: {type: string, enum: [clear, paused]}, resourceStatus: {type: string, enum: [UNCONFIGURED, CONFIGURED]}, message: {type: string}}}
    Problem: {type: object, required: [code, status, message], properties: {type: {type: string, format: uri}, title: {type: string}, status: {type: integer}, code: {type: string}, message: {type: string}, requestId: {type: string}, details: {type: object}}}
